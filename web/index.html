<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle RC Car</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            max-width: 400px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .joystick-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        button {
            width: 70px;
            height: 70px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
            color: white;
        }
        
        .btn-frente, .btn-re, .btn-esquerda, .btn-direita, .btn-parar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-frente:hover, .btn-re:hover, .btn-esquerda:hover, .btn-direita:hover, .btn-parar:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .btn-frente:active, .btn-re:active, .btn-esquerda:active, .btn-direita:active, .btn-parar:active {
            transform: translateY(0);
        }
        
        .control-pad {
            display: grid;
            grid-template-columns: 70px 70px 70px;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .empty {
            width: 70px;
            height: 70px;
        }
        
        .speed-control {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .speed-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #333;
            font-weight: bold;
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .speed-value {
            text-align: center;
            font-size: 18px;
            color: #667eea;
            font-weight: bold;
            margin-top: 5px;
        }
        
        .status {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            color: #333;
            font-size: 14px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .status.moving {
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: bold;
        }
        
        .btn-parar {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            grid-column: 1 / -1;
            width: 100%;
            height: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 Controle RC Car</h1>
        <p class="subtitle">Controle remoto via WiFi → Android → Arduino</p>
        
        <div class="speed-control">
            <div class="speed-label">
                <span>Velocidade:</span>
                <span id="speedValue">150</span>
            </div>
            <input type="range" id="speedSlider" min="0" max="255" value="150">
            <div class="speed-value" id="speedPercent">59%</div>
        </div>
        
        <div class="joystick-area">
            <div class="control-pad">
                <div class="empty"></div>
                <button class="btn-frente" onmousedown="enviarComando('frente')" ontouchstart="enviarComando('frente')" onmouseup="enviarComando('parar')" ontouchend="enviarComando('parar')">⬆️</button>
                <div class="empty"></div>
                
                <button class="btn-esquerda" onmousedown="enviarComando('esquerda')" ontouchstart="enviarComando('esquerda')" onmouseup="enviarComando('parar')" ontouchend="enviarComando('parar')">⬅️</button>
                <button class="btn-parar" onmousedown="enviarComando('parar')" ontouchstart="enviarComando('parar')">⏹️ PARAR</button>
                <button class="btn-direita" onmousedown="enviarComando('direita')" ontouchstart="enviarComando('direita')" onmouseup="enviarComando('parar')" ontouchend="enviarComando('parar')">➡️</button>
                
                <div class="empty"></div>
                <button class="btn-re" onmousedown="enviarComando('re')" ontouchstart="enviarComando('re')" onmouseup="enviarComando('parar')" ontouchend="enviarComando('parar')">⬇️</button>
                <div class="empty"></div>
            </div>
        </div>
        
        <div class="status" id="status">Pronto para controlar</div>
    </div>
    
    <script>
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        const speedPercent = document.getElementById('speedPercent');
        const statusDiv = document.getElementById('status');

        // Protocolo: mesmo texto que vai para a serial do Arduino
        const CODIGOS = { frente: 'F', re: 'B', esquerda: 'L', direita: 'R', parar: 'S', freio: 'X' };
        const NOMES = {
            frente: 'FRENTE ⬆️', re: 'RÉ ⬇️', esquerda: 'ESQUERDA ⬅️',
            direita: 'DIREITA ➡️', parar: 'PARADO ⏹️', freio: 'FREIO'
        };

        // ---------- WebSocket persistente (menor latência que um fetch por comando) ----------
        let ws = null;

        function conectar() {
            ws = new WebSocket('ws://' + location.host + '/ws');
            ws.onopen = () => {
                statusDiv.textContent = 'Conectado ✅';
                ws.send('V' + speedSlider.value);
            };
            ws.onclose = () => {
                statusDiv.textContent = 'Sem conexão ⚠️ reconectando…';
                statusDiv.classList.remove('moving');
                setTimeout(conectar, 1000);
            };
        }

        function enviar(msg) {
            if (ws && ws.readyState === WebSocket.OPEN) ws.send(msg);
        }

        conectar();
        setInterval(() => enviar('P'), 1000); // heartbeat: mantém a conexão viva

        speedSlider.addEventListener('input', (e) => {
            const vel = e.target.value;
            speedValue.textContent = vel;
            speedPercent.textContent = Math.round((vel / 255) * 100) + '%';
            enviar('V' + vel);
        });

        // Enquanto um botão de movimento estiver pressionado, o comando é
        // reenviado a cada 200 ms. O Arduino para sozinho se ficar 600 ms
        // sem receber nada (failsafe contra queda de WiFi).
        let repeticao = null;

        function enviarComando(comando) {
            clearInterval(repeticao);
            repeticao = null;

            const codigo = CODIGOS[comando];
            enviar(codigo);

            if (comando === 'parar' || comando === 'freio') {
                statusDiv.textContent = NOMES[comando];
                statusDiv.classList.remove('moving');
            } else {
                statusDiv.textContent = NOMES[comando];
                statusDiv.classList.add('moving');
                repeticao = setInterval(() => enviar(codigo), 200);
            }
        }

        // Evita que o toque dispare também os eventos de mouse (comando duplo)
        document.querySelectorAll('button').forEach(b =>
            b.addEventListener('touchstart', e => e.preventDefault(), { passive: false }));

        // Se a aba perder o foco (ligação, troca de app), para o carro
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) enviarComando('parar');
        });
    </script>
</body>
</html>
